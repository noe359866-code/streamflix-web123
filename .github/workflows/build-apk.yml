name: Build StreamFlex APK

on:
  push:
    branches: [ main, 'arena/**' ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Creates a GitHub Release with the APK'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build & sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass streamflex \
            -keypass streamflex \
            -alias streamflex \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=StreamFlex, OU=Mobile, O=StreamFlex, L=Managua, S=Managua, C=NI"

      - name: Build release APK
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: streamflex
          SIGNING_KEY_ALIAS: streamflex
          SIGNING_KEY_PASSWORD: streamflex
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          echo "APK: $APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "build-tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | head -n 5
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamFlex-0.0.1-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.1
          name: StreamFlex v0.0.1
          body: |
            ## StreamFlex v0.0.1

            Primera versión propia de StreamFlex.

            - Nombre: **StreamFlex**
            - Versión: **0.0.1** (versionCode 1)
            - Package: `com.noe.streamflex`
            - minSdk 21 (Android 5.0+) · targetSdk 34
            - Sin anuncios, sin permisos, sin telemetría.

            Instala el APK adjunto (`StreamFlex-0.0.1.apk`) en tu Android.
            Debes permitir "instalar apps de origen desconocido".
          files: ${{ env.APK_PATH }}
          fail_on_unmatched_files: true
