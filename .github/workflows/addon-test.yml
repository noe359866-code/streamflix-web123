name: Addon Stremio · Tests

# Solo corre cuando cambia el addon (no interfiere con el build del APK).
on:
  push:
    paths:
      - 'stremio-addon-estrenosanime/**'
      - '.github/workflows/addon-test.yml'
  pull_request:
    paths:
      - 'stremio-addon-estrenosanime/**'
      - '.github/workflows/addon-test.yml'
  workflow_dispatch:

concurrency:
  group: addon-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node tests + smoke del manifiesto
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: stremio-addon-estrenosanime

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stremio-addon-estrenosanime/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        run: |
          for f in src/*.js scripts/*.js test/*.js; do node --check "$f"; done
          echo "OK: sintaxis"

      - name: Unit tests (sin red)
        run: npm test

      - name: Smoke test del servidor (modo demo)
        run: |
          DEMO_FALLBACK=1 PORT=7000 node src/index.js &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:7000/health && break || sleep 1
          done
          # Manifiesto SOLO-STREAM
          curl -fsS http://127.0.0.1:7000/manifest.json > /tmp/manifest.json
          grep -q '"id":"com.streamflex.estrenosanime"' /tmp/manifest.json
          grep -q '"resources":\["stream"\]' /tmp/manifest.json
          grep -q '"catalogs":\[\]' /tmp/manifest.json
          # catalog/meta NO deben existir como recursos
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7000/catalog/series/ea-series-popular.json)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:7000/meta/series/ea%3Aone-piece.json')" = "404"
          # Stream desde un ID de IMDb (One Piece): deben responder AMBOS proveedores
          curl -fsS "http://127.0.0.1:7000/stream/series/tt0388629%3A1%3A1.json" | grep -q '"streams"'
          curl -fsS "http://127.0.0.1:7000/stream/series/tt0388629%3A1%3A1.json" | grep -q 'estrenosanime.net/ver/'
          curl -fsS "http://127.0.0.1:7000/stream/series/tt0388629%3A1%3A1.json" | grep -q 'infinityanime.net/'
          curl -fsS "http://127.0.0.1:7000/debug/map?id=tt0388629:1:1&type=series" | grep -q '"provider":"infinity"'
          curl -fsS "http://127.0.0.1:7000/stream/series/ia%3Aone-piece-tv%3A1%3A1.json" | grep -q 'infinityanime.net/one-piece-tv/episodio-1/'
          curl -fsS -o /dev/null -w "landing %{http_code}\n" http://127.0.0.1:7000/
          echo "OK: manifiesto solo-stream, sin catalog/meta, streams de EstrenosAnime + InfinityAnime"
