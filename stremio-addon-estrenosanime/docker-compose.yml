services:
  estrenosanime-addon:
    build: .
    image: estrenosanime-stremio-addon
    container_name: estrenosanime-addon
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      PORT: "7000"
      # EA_BASE_URL: https://estrenosanime.net   # solo si la web cambia de dominio
      # DEBUG: "0"                               # oculta /debug/* en producción
